<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{layout/header :: header-head}">
    <title>Soát Vé - Staff</title>
</head>
<body style="background-color: #f4f6f9 !important; color: #212529 !important;">
<div th:replace="~{layout/header :: navbar}"></div>

<main class="container my-5" style="max-width: 800px;">
    <!-- Khối nhập mã vé -->
    <div class="card bg-white border-0 shadow-sm p-4 mb-4" style="border-radius: 12px;">
        <h2 class="h4 fw-bold mb-4 border-start border-4 border-danger ps-3" style="color: #212529;">
            <i ></i>Soát Vé Vào Cửa
        </h2>

        <!-- Form nhập hoặc quét mã -->
        <form th:action="@{/staff/tickets/validate}" method="post" class="row g-3 align-items-center">
            <div class="col-md-9">
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-ticket text-muted"></i></span>
                    <input type="text" name="ticketCode" class="form-control bg-light border-start-0"
                           placeholder="Nhập hoặc quét mã vé" required
                           aria-label="Mã vé"
                           th:value="${param.ticketCode}"
                           style="color: #212529 !important;">
                </div>
            </div>
            <div class="col-md-3">
                <button type="submit" class="btn w-100 fw-bold" style="background-color: #e50914; color: white;">
                    <i class="fa-solid fa-circle-check me-2"></i>Kiểm Tra
                </button>
            </div>
        </form>
    </div>

    <!-- Khung kết quả hiển thị (Chỉ xuất hiện khi có thông báo trả về từ Controller) -->
    <!-- 1. Trường hợp Vé hợp lệ (Success) -->
    <div class="card bg-white border-0 shadow-sm p-4 text-center border-top border-4 border-success"
         th:if="${successMessage != null}" style="border-radius: 12px;">
        <i class="fa-solid fa-circle-check text-success display-4 mb-3"></i>
        <h4 class="fw-bold text-success">VÉ HỢP LỆ</h4>
        <p class="text-muted" th:text="${successMessage}">Thông tin vé thành công</p>

        <!-- Chi tiết vé (Tự động bind dữ liệu từ database khi có) -->
        <div class="bg-light p-3 rounded-3 text-start mx-auto" style="max-width: 500px;" th:if="${ticket != null}">
            <div class="d-flex justify-content-between mb-2">
                <span class="text-muted">Phim:</span>
                <span class="fw-bold" th:text="${ticket.showtime.movie.title}">Tên Phim</span>
            </div>
            <div class="d-flex justify-content-between mb-2">
                <span class="text-muted">Phòng chiếu:</span>
                <span class="fw-bold" th:text="${ticket.showtime.room.name}">Phòng A1</span>
            </div>
            <div class="d-flex justify-content-between mb-2">
                <span class="text-muted">Ghế ngồi:</span>
                <span class="fw-bold text-danger" th:text="${ticket.seat.seatCode}">A10</span>
            </div>
            <div class="d-flex justify-content-between">
                <span class="text-muted">Giờ chiếu:</span>
                <span class="fw-bold" th:text="${#temporals.format(ticket.showtime.startTime, 'HH:mm dd/MM/yyyy')}">19:00 29/06/2026</span>
            </div>
        </div>
    </div>

    <!-- 2. Trường hợp Vé không hợp lệ (Error) -->
    <div class="card bg-white border-0 shadow-sm p-4 text-center border-top border-4 border-danger"
         th:if="${errorMessage != null}" style="border-radius: 12px;">
        <i class="fa-solid fa-circle-xmark text-danger display-4 mb-3"></i>
        <h4 class="fw-bold text-danger">VÉ KHÔNG HỢP LỆ</h4>
        <p class="text-muted mb-0" th:text="${errorMessage}">Lý do lỗi (Đã sử dụng, sai suất chiếu...)</p>
    </div>
</main>

<div th:replace="~{layout/footer :: footer}"></div>
</body>
</html>
