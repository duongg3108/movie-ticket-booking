<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{layout/header :: header-head}">
    <title>Duyệt Booking - Staff</title>
</head>
<body style="background-color: #f4f6f9 !important; color: #212529 !important;">
<div th:replace="~{layout/header :: navbar}"></div>

<main class="container my-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="h4 fw-bold border-start border-4 border-danger ps-3" style="color: #212529;">
            <i ></i>Yêu Cầu Duyệt Booking (Đã Thanh Toán)
        </h2>
    </div>

    <!-- Bảng danh sách booking chờ duyệt -->
    <div class="card bg-white border-0 shadow-sm p-4" style="border-radius: 12px;">
        <div class="table-responsive">
            <table class="table table-hover align-middle" style="color: #212529;">
                <thead class="table-light">
                <tr>
                    <th scope="col">Mã Booking</th>
                    <th scope="col">Khách hàng</th>
                    <th scope="col" class="text-center">Suất chiếu</th>
                    <th scope="col" class="text-center">Ngày thanh toán</th>
                    <th scope="col" class="text-end">Tổng tiền</th>
                    <th scope="col" class="text-center">Trạng thái</th>
                    <th scope="col" class="text-center">Thao tác</th>
                </tr>
                </thead>
                <tbody>
                <!-- Lặp danh sách các Booking ở trạng thái PAID -->
                <tr th:each="b : ${pendingBookings}">
                    <td class="fw-bold text-dark" th:text="${b.bookingCode}">BK202606290002</td>
                    <td>
                        <div class="fw-bold" th:text="${b.user.fullName}">Pham Minh Anh</div>
                        <small class="text-muted" th:text="${b.user.phone}">SĐT</small>
                    </td>
                    <td class="text-center">
                        <span class="fw-bold" th:text="${b.showtime.movie.title}">Tên phim</span><br/>
                        <small class="text-muted" th:text="${#temporals.format(b.showtime.startTime, 'HH:mm dd/MM')}">09:00 29/06</small>
                    </td>
                    <td class="text-center text-muted" th:text="${#temporals.format(b.paidAt, 'HH:mm dd/MM/yyyy')}">08:15 29/06/2026</td>
                    <td class="text-end fw-bold text-danger" th:text="${#numbers.formatDecimal(b.totalAmount, 0, 'COMMA', 0, 'POINT')} + ' đ'">150,000 đ</td>
                    <td class="text-center">
                        <span class="badge bg-warning text-dark fw-bold">PAID</span>
                    </td>
                    <td class="text-center">
                        <!-- Nút gửi yêu cầu duyệt -->
                        <form th:action="@{/staff/bookings/confirm}" method="post" style="display:inline;">
                            <input type="hidden" name="bookingId" th:value="${b.id}" />
                            <button type="submit" class="btn btn-sm text-white fw-bold px-3" style="background-color: #e50914;">
                                <i class="fa-solid fa-check-double me-1"></i>Duyệt Vé
                            </button>
                        </form>
                    </td>
                </tr>
                <!-- Hiển thị khi không có yêu cầu nào -->
                <tr th:if="${#lists.isEmpty(pendingBookings)}">
                    <td colspan="7" class="text-center py-5 text-muted">
                        <i class="fa-solid fa-circle-check display-4 mb-3 text-success"></i>
                        <p class="mb-0">Tuyệt vời! Hiện tại không có booking nào đang chờ duyệt.</p>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<div th:replace="~{layout/footer :: footer}"></div>
</body>
</html>
