<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Vé Điện Tử</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .ticket-cut {
      border-top: 2px dashed #ccc;
      margin: 20px 0;
    }
  </style>
</head>
<body class="bg-dark">
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <!-- Thông báo thanh toán thành công -->
      <div th:if="${successMsg}" class="alert alert-success text-center" th:text="${successMsg}"></div>

      <div class="card border-0 rounded-4 overflow-hidden">
        <div class="card-body p-4 bg-white text-center">
          <h2 class="fw-bold text-uppercase text-primary mb-1">E-TICKET</h2>
          <p class="text-muted small">Vui lòng đưa mã này cho nhân viên soát vé (Người 4)</p>

          <h4 class="mt-4 fw-bold" th:text="${booking.showtime.movie.title}">Tên Phim</h4>
          <p class="mb-1" th:text="${booking.showtime.room.cinema.name}">Tên Rạp</p>
          <p class="text-danger fw-bold" th:text="'Phòng: ' + ${booking.showtime.room.name}">Phòng 1</p>

          <div class="ticket-cut"></div>

          <div class="row text-start mb-3">
            <div class="col-6">
              <small class="text-muted d-block">Ngày chiếu</small>
              <strong th:text="${#temporals.format(booking.showtime.startTime, 'dd/MM/yyyy')}">30/06/2026</strong>
            </div>
            <div class="col-6">
              <small class="text-muted d-block">Giờ chiếu</small>
              <strong th:text="${#temporals.format(booking.showtime.startTime, 'HH:mm')}">20:00</strong>
            </div>
          </div>

          <div class="row text-start">
            <div class="col-12">
              <!-- TODO: Bạn có thể truyền list danh sách ghế từ BookingSeat sang đây -->
              <small class="text-muted d-block">Ghế ngồi</small>
              <strong>A1, A2</strong>
            </div>
          </div>

          <div class="ticket-cut"></div>

          <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=TICKET_ID_" th:attrappend="src=${booking.id}" alt="QR Code" class="img-fluid mb-2">
          <p class="font-monospace fw-bold fs-5 tracking-widest mb-0" th:text="'TCK-' + ${booking.id}">TCK-1</p>
        </div>
        <div class="card-footer bg-light text-center border-0 py-3">
          <a th:href="@{/customer/history}" class="btn btn-outline-dark btn-sm">Về lịch sử đặt vé</a>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>>
