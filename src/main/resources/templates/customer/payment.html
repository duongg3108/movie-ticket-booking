<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Thanh toán hóa đơn</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow">
        <div class="card-header bg-primary text-white">
          <h4 class="mb-0">Thanh toán đơn hàng #<span th:text="${booking.id}"></span></h4>
        </div>
        <div class="card-body">
          <h5 class="card-title text-center mb-4" th:text="${booking.showtime.movie.title}">Tên Phim</h5>
          <ul class="list-group mb-4">
            <li class="list-group-item d-flex justify-content-between align-items-center">
              Thời gian chiếu
              <span class="fw-bold" th:text="${#temporals.format(booking.showtime.startTime, 'dd/MM/yyyy HH:mm')}"></span>
            </li>
            <li class="list-group-item d-flex justify-content-between align-items-center">
              Tổng tiền cần thanh toán
              <span class="fw-bold text-danger fs-5" th:text="${#numbers.formatDecimal(booking.totalAmount, 0, 'COMMA', 0, 'POINT')} + ' đ'"></span>            </li>
          </ul>

          <form th:action="@{/customer/pay}" method="post">
            <input type="hidden" name="bookingId" th:value="${booking.id}">
            <div class="mb-3">
              <label class="form-label fw-bold">Chọn phương thức thanh toán:</label>
              <div class="form-check">
                <input class="form-check-input" type="radio" name="paymentMethod" id="vnpay" value="VNPAY" checked>
                <label class="form-check-label" for="vnpay">Thanh toán qua VNPay</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="radio" name="paymentMethod" id="momo" value="MOMO">
                <label class="form-check-label" for="momo">Thanh toán qua MoMo</label>
              </div>
            </div>
            <div class="d-grid gap-2">
              <button type="submit" class="btn btn-primary btn-lg">Xác nhận thanh toán</button>
              <a th:href="@{/customer/history}" class="btn btn-outline-secondary">Quay lại lịch sử</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
