<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<!-- ========== Admin Head Fragment ========== -->
<head th:fragment="admin-head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CinemaX Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #ffffff;
            --bg-card: #f8f9fa;
            --bg-sidebar: #f1f3f5;
            --accent: #e11d48;
            --accent-hover: #be123c;
            --text-main: #1a1a2e;
            --text-muted: #6c757d;
            --border-color: rgba(0,0,0,0.1);
        }
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
        }
        /* ===== Admin Navbar ===== */
        .admin-navbar {
            background: #ffffff;
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-color);
            padding: 0.6rem 0;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
        }
        .admin-navbar .navbar-brand {
            font-weight: 700;
            font-size: 1.4rem;
            color: var(--accent) !important;
            letter-spacing: -0.5px;
        }
        .admin-navbar .navbar-brand span {
            color: var(--text-muted);
            font-weight: 400;
            font-size: 0.85rem;
            margin-left: 8px;
        }
        .admin-navbar .nav-link {
            color: var(--text-muted) !important;
            font-weight: 500;
            font-size: 0.9rem;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            transition: all 0.2s ease;
        }
        .admin-navbar .nav-link:hover,
        .admin-navbar .nav-link.active {
            color: var(--text-main) !important;
            background: rgba(0,0,0,0.04);
        }
        .admin-navbar .nav-link.active {
            color: var(--accent) !important;
            background: rgba(225, 29, 72, 0.08);
        }
        .admin-navbar .nav-link i {
            width: 20px;
            text-align: center;
        }

        /* ===== Cards ===== */
        .admin-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
        }

        /* ===== Buttons ===== */
        .btn-accent {
            background: linear-gradient(135deg, #e11d48, #f43f5e);
            color: #fff;
            border: none;
            font-weight: 600;
            border-radius: 8px;
            padding: 8px 20px;
            transition: all 0.3s ease;
        }
        .btn-accent:hover {
            background: linear-gradient(135deg, #be123c, #e11d48);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(225, 29, 72, 0.3);
            color: #fff;
        }

        /* ===== Table ===== */
        .table-admin {
            --bs-table-bg: transparent;
            --bs-table-color: var(--text-main);
            --bs-table-hover-bg: rgba(0,0,0,0.02);
            margin-bottom: 0;
        }
        .table-admin thead th {
            background-color: #e9ecef;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-color);
            text-transform: uppercase;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            padding: 12px 16px;
        }
        .table-admin tbody td {
            border-bottom: 1px solid var(--border-color);
            padding: 12px 16px;
            vertical-align: middle;
        }
        .table-admin tbody tr:hover {
            background: rgba(0,0,0,0.02);
        }

        /* ===== Status Filter Tabs ===== */
        .status-tabs {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .status-tabs .tab-btn {
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            background: transparent;
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
        }
        .status-tabs .tab-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }
        .status-tabs .tab-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        /* ===== Form Styles ===== */
        .form-control, .form-select {
            background-color: #ffffff;
            border-color: var(--border-color);
            color: var(--text-main);
        }
        .form-control:focus, .form-select:focus {
            background-color: #ffffff;
            border-color: var(--accent);
            color: var(--text-main);
            box-shadow: 0 0 0 3px rgba(225, 29, 72, 0.12);
        }
        .form-control::placeholder {
            color: #adb5bd;
        }

        /* ===== Poster Thumbnail ===== */
        .poster-thumb {
            width: 50px;
            height: 72px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        /* ===== Animations ===== */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in {
            animation: fadeInUp 0.4s ease forwards;
        }

        /* ===== Badge styles ===== */
        .badge-status {
            font-size: 0.75rem;
            font-weight: 500;
            padding: 5px 12px;
            border-radius: 20px;
        }

        /* ===== Override Bootstrap text-white to text-dark ===== */
        .text-white-override {
            color: var(--text-main) !important;
        }
    </style>
</head>

<!-- ========== Admin Navbar Fragment ========== -->
<body>
<nav th:fragment="admin-navbar" class="navbar navbar-expand-lg admin-navbar sticky-top">
    <div class="container-fluid px-4">
        <a class="navbar-brand" href="/">
            <i class="fa-solid fa-film me-2"></i>CinemaX<span>Admin Panel</span>
        </a>
        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#adminNav">
            <i class="fa-solid fa-bars" style="color: var(--text-main);"></i>
        </button>
        <div class="collapse navbar-collapse" id="adminNav">
            <ul class="navbar-nav me-auto ms-4">
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activePage == 'movies' ? ' active' : ''}" href="/admin/movies">
                        Quản lý phim
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/admin/cinemas">
                        Rạp chiếu
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activePage == 'showtimes' ? ' active' : ''}" href="/admin/showtimes">
                        Lịch chiếu
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/admin/users">
                        Người dùng
                    </a>
                </li>
            </ul>
            <div class="d-flex align-items-center gap-3">
                <a href="/" class="btn btn-outline-dark btn-sm">
                    Xem trang chủ
                </a>
                <div sec:authorize="isAuthenticated()" class="dropdown">
                    <button class="btn btn-outline-secondary btn-sm dropdown-toggle" type="button" data-bs-toggle="dropdown">
                        <i class="fa-solid fa-user-shield me-1"></i><span sec:authentication="name">Admin</span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li>
                            <form th:action="@{/logout}" method="post">
                                <button class="dropdown-item text-danger" type="submit"><i class="fa-solid fa-right-from-bracket me-1"></i>Đăng xuất</button>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</nav>
</body>
</html>
