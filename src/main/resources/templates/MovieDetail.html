<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/header :: header-head}">
    <title th:text="${movie.title + ' - CinemaX'}">Chi tiết phim - CinemaX</title>
</head>
<body>
<div th:replace="~{layout/header :: navbar}"></div>

<main class="container my-5">

    <div class="row g-5">
        <!-- Poster -->
        <div class="col-md-4">
            <img th:src="${movie.posterUrl != null ? movie.posterUrl : 'https://picsum.photos/seed/noposter/400/600'}"
                 class="img-fluid rounded-4 shadow" style="width: 100%; object-fit: cover; aspect-ratio: 2/3;"
                 alt="Movie Poster">
        </div>

        <!-- Thông tin phim -->
        <div class="col-md-8">
            <span class="badge mb-2"
                  th:classappend="${movie.status.name() == 'NOW_SHOWING'} ? 'bg-danger' : 'bg-warning text-dark'"
                  th:text="${movie.status.name() == 'NOW_SHOWING'} ? 'Đang chiếu' : 'Sắp chiếu'">Đang chiếu</span>

            <h1 class="fw-bold text-dark mb-3" th:text="${movie.title}">Tên Phim</h1>

            <div class="d-flex flex-wrap gap-2 mb-4">
                <span class="badge bg-secondary" th:if="${movie.genre}" th:text="${movie.genre}">Thể loại</span>
                <span class="badge bg-secondary" th:if="${movie.durationMinutes}"
                      th:text="${movie.durationMinutes + ' phút'}">120 phút</span>
                <span class="badge bg-secondary" th:if="${movie.ageRating}" th:text="${movie.ageRating}">T18</span>
                <span class="badge bg-secondary" th:if="${movie.releaseDate}"
                      th:text="${'Khởi chiếu: ' + #temporals.format(movie.releaseDate, 'dd/MM/yyyy')}">Khởi chiếu</span>
            </div>

            <h5 class="text-dark mb-2">Nội dung phim</h5>
            <p class="text-muted"
               th:text="${movie.description != null ? movie.description : 'Đang cập nhật nội dung phim.'}">
                Mô tả phim...
            </p>

            <a href="/showtime" class="btn btn-accent btn-lg mt-3">
                Đặt Vé Ngay
            </a>
        </div>
    </div>

    <!-- Suất chiếu sắp tới -->
    <section class="mt-5">
        <h2 class="h4 fw-bold text-dark mb-4 border-start border-4 border-danger ps-3">Suất Chiếu Sắp Tới</h2>

        <div th:if="${not #lists.isEmpty(upcomingShowtimes)}" class="row row-cols-1 row-cols-md-3 g-3">
            <div class="col" th:each="st : ${upcomingShowtimes}">
                <div class="card h-100 bg-light text-dark border shadow-sm">
                    <div class="card-body">
                        <h6 class="card-title fw-bold mb-1" th:text="${st.room.cinema.name}">Rạp</h6>
                        <p class="card-text text-muted small mb-2" th:text="${st.room.cinema.address}">Địa chỉ</p>
                        <div class="d-flex justify-content-between align-items-center">
                            <span th:text="${#temporals.format(st.startTime, 'HH:mm dd/MM/yyyy')}">20:45 02/07/2026</span>
                            <a th:href="@{'/booking/' + ${st.id}}" class="btn btn-outline-danger btn-sm">Chọn ghế</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(upcomingShowtimes)}" class="alert alert-light border text-center py-4 text-muted">
            Hiện chưa có suất chiếu nào sắp tới cho phim này.
        </div>
    </section>

</main>

<div th:replace="~{layout/footer :: footer}"></div>
</body>
</html>
